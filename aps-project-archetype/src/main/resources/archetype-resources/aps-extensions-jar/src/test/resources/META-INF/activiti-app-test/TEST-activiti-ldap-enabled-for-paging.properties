#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )

${symbol_pound} --------------------------
${symbol_pound} LDAP AUTHENTICATION CONFIG
${symbol_pound} --------------------------

${symbol_pound} Note that this is AUTHENTICATION only, not synchronization.
${symbol_pound} For this to work properly, the LDAP synchronization (see below), needs to be 
${symbol_pound} enabled and configured correctly, too.

ldap.authentication.enabled=true
ldap.authentication.dnPattern= uid={0},ou=users,dc=alfresco,dc=com

${symbol_pound} ----------------------------
${symbol_pound} LDAP SYNCHRONIZATION CONFIG
${symbol_pound} ----------------------------

${symbol_pound} Sync is disabled IN TEST. Because we want to manually test the syncing
ldap.synchronization.full.enabled=true 
ldap.synchronization.full.cronExpression=0 0 0 * * ?

${symbol_pound} Enabled partial synchronization. This will only check the users/groups which are changes since last sync.
${symbol_pound} A partial sync cannot detect deletes of users/groups. This is done by the full sync.
ldap.synchronization.partial.enabled=false
ldap.synchronization.partial.cronExpression=0 0 */4 * * ?

${symbol_pound} Paging (default = no paging).
${symbol_pound} If enabled, default page size is 100
ldap.synchronization.paging.enabled=true
ldap.synchronization.paging.size=100

${symbol_pound} Db batch sizes
ldap.synchronization.db.insert.batch.size=25
ldap.synchronization.db.query.batch.size=100


${symbol_pound} ----------------------
${symbol_pound} LDAP CONNECTION CONFIG
${symbol_pound} ----------------------

${symbol_pound} The URL to connect to the LDAP server 
ldap.authentication.java.naming.provider.url=ldap://localhost:10590

${symbol_pound} The default principal to use (only used for LDAP sync)
ldap.synchronization.java.naming.security.principal=uid=admin,ou=system

${symbol_pound} The password for the default principal (only used for LDAP sync)
ldap.synchronization.java.naming.security.credentials=secret

${symbol_pound} The authentication mechanism to use for synchronization
${symbol_pound}ldap.synchronization.java.naming.security.authentication=simple

${symbol_pound} LDAPS truststore configuration properties
${symbol_pound}ldap.authentication.truststore.path=
${symbol_pound}ldap.authentication.truststore.passphrase=
${symbol_pound}ldap.authentication.truststore.type=
${symbol_pound} Set to 'ssl' to enable truststore configuration via subsystem's properties
${symbol_pound}ldap.authentication.java.naming.security.protocol=ssl

${symbol_pound} The LDAP context factory to use
${symbol_pound}ldap.authentication.java.naming.factory.initial=com.sun.jndi.ldap.LdapCtxFactory

${symbol_pound} Requests timeout, in miliseconds, use 0 for none (default)
${symbol_pound}ldap.authentication.java.naming.read.timeout=0

${symbol_pound} See http://docs.oracle.com/javase/jndi/tutorial/ldap/referral/jndi.html
${symbol_pound}ldap.synchronization.java.naming.referral=follow



${symbol_pound} -----------
${symbol_pound} USER CONFIG
${symbol_pound} -----------

${symbol_pound} The user search base restricts the LDAP user query to a sub section of tree on the LDAP server.
ldap.synchronization.userSearchBase=ou=users,dc=alfresco,dc=com

${symbol_pound} The query to select all objects that represent the users to import.
ldap.synchronization.personQuery=(objectclass${symbol_escape}=inetOrgPerson)

${symbol_pound} The query to select objects that represent the users to import that have changed since a certain time.
ldap.synchronization.personDifferentialQuery=(&(objectclass${symbol_escape}=inetOrgPerson)(!(modifyTimestamp<${symbol_escape}={0})))

${symbol_pound} The attribute name on people objects found in LDAP to use as the uid in Alfresco
ldap.synchronization.userIdAttributeName=uid

${symbol_pound}${symbol_pound} The attribute on person objects in LDAP to map to the first name property of a user
ldap.synchronization.userFirstNameAttributeName=givenName

${symbol_pound} The attribute on person objects in LDAP to map to the last name property of a user
ldap.synchronization.userLastNameAttributeName=sn

${symbol_pound} The attribute on person objects in LDAP to map to the email property of a user
ldap.synchronization.userEmailAttributeName=mail

ldap.synchronization.userType=inetOrgPerson

${symbol_pound} Set the dn of the people that need to be made tenant admin (one tenant). Delimit multiple entries with ;, cause we can't use a comma of course. Note: no trimming of spaces will be applied
ldap.synchronization.tenantAdminDn=uid=joram,ou=users,dc=alfresco,dc=com;uid=tijs,ou=users,dc=alfresco,dc=com

${symbol_pound} Set the dn of the people that need to be made tenant manager (multiple tenants). Delimit multiple entries with ;, cause we can't use a comma of course. Note: no trimming of spaces will be applied
ldap.synchronization.tenantManagerDn=uid=joram,ou=users,dc=alfresco,dc=com

${symbol_pound} ------------
${symbol_pound} GROUP CONFIG
${symbol_pound} ------------

${symbol_pound} The group search base restricts the LDAP group query to a sub section of tree on the LDAP server.
ldap.synchronization.groupSearchBase=ou=groups,dc=alfresco,dc=com

${symbol_pound} The query to select all objects that represent the groups to import.
ldap.synchronization.groupQuery=(objectclass${symbol_escape}=groupOfNames)

${symbol_pound} The query to select objects that represent the groups to import that have changed since a certain time.
ldap.synchronization.groupDifferentialQuery=(&(objectclass${symbol_escape}=groupOfNames)(!(modifyTimestamp<${symbol_escape}={0})))

${symbol_pound} The attribute on LDAP group objects to map to the authority name property in Alfresco
ldap.synchronization.groupIdAttributeName=cn

${symbol_pound} The attribute in LDAP on group objects that defines the DN for its members
ldap.synchronization.groupMemberAttributeName=member

ldap.synchronization.groupMemberRangeEnabled=true
ldap.synchronization.groupMemberRangeSize=200

ldap.synchronization.groupType=groupOfNames



${symbol_pound} ------------------------
${symbol_pound} GENERIC ATTRIBUTE CONFIG
${symbol_pound} ------------------------

${symbol_pound} The dn of an entry. 
ldap.synchronization.distinguishedNameAttributeName=dn

${symbol_pound} The name of the operational attribute recording the last update time for a group or user.
ldap.synchronization.modifyTimestampAttributeName=modifyTimestamp

${symbol_pound} The name of the operational attribute recording the create time for a group or user.
ldap.synchronization.createTimestampAttributeName=createTimestamp

${symbol_pound} The timestamp format. Unfortunately, this varies between directory servers.
ldap.synchronization.timestampFormat=yyyyMMddHHmmss'Z'

${symbol_pound} The timestamp format locale language. 'en' by default. Follows the java.util.Locale semantics.
ldap.synchronization.timestampFormat.locale.language=en

${symbol_pound} The timestamp format locale country. 'GB' by default. Follows the java.util.Locale semantics.
ldap.synchronization.timestampFormat.locale.country=GB

${symbol_pound} The timestamp format timezone. 'GMT' by default. Folloez the java.text.SimpleDateFormat semantics.
ldap.synchronization.timestampFormat.timezone=GMT


${symbol_pound} -----------------------
${symbol_pound} LDAP CONNECTION POOLING
${symbol_pound} -----------------------

${symbol_pound} Options=
${symbol_pound} nothing filled in: no connection pooling
${symbol_pound} 'jdk': use the default jdk pooling mechanism
${symbol_pound} 'spring': use the spring ldap connection pooling facilities. These can be configured further below
${symbol_pound}ldap.synchronization.pooling.type=spring

${symbol_pound} Following settings follow the semantics of org.springframework.ldap.pool.factory.PoolingContextSource
${symbol_pound}ldap.synchronization.pooling.minIdle=0
${symbol_pound}ldap.synchronization.pooling.maxIdle=8
${symbol_pound}ldap.synchronization.pooling.maxActive=0
${symbol_pound}ldap.synchronization.pooling.maxTotal=-1
${symbol_pound}ldap.synchronization.pooling.maxWait=-1
${symbol_pound} Options for exhausted action: fail | block | grow
${symbol_pound}ldap.synchronization.pooling.whenExhaustedAction=block
${symbol_pound}ldap.synchronization.pooling.testOnBorrow=false
${symbol_pound}ldap.synchronization.pooling.testOnReturn=false
${symbol_pound}ldap.synchronization.pooling.testWhileIdle=false
${symbol_pound}ldap.synchronization.pooling.timeBetweenEvictionRunsMillis=-1
${symbol_pound}ldap.synchronization.pooling.minEvictableIdleTimeMillis=1800000
${symbol_pound}ldap.synchronization.pooling.numTestsPerEvictionRun=3

${symbol_pound} Connection pool validation (see http://docs.spring.io/spring-ldap/docs/2.0.2.RELEASE/reference/${symbol_pound}pooling for semantics)
${symbol_pound} Used when any of the testXXX above are set to true
${symbol_pound}ldap.synchronization.pooling.validation.base=
${symbol_pound}ldap.synchronization.pooling.validation.filter=
${symbol_pound} Search control: object, oneLevel, subTree
${symbol_pound}ldap.synchronization.pooling.validation.searchControlsRefs=


