${symbol_pound}${symbol_pound} The following settings configure app access when a new user is created in the system (manuall or through LDAP sync).
${symbol_pound}${symbol_pound} To enable access, set the property 'app.[APP-NAME].default.enabled' to 'true'. If 'true', a newly created user will
${symbol_pound}${symbol_pound} be given access to this app.
${symbol_pound}${symbol_pound}
${symbol_pound}${symbol_pound} The access is configured by adding the user to a group with a certain capability that enabled the app.
${symbol_pound}${symbol_pound} The name of that group can be configured using the 'app.[APP-NAME].default.capabilities.group' property. If this
${symbol_pound}${symbol_pound} property is set, and the 'app.[APP-NAME].default.enabled property' is set to 'true', the group with this name will be used
${symbol_pound}${symbol_pound} to add the user to and provide access to the app. If the group does not exist, it is created.
${symbol_pound}${symbol_pound} If the property is commented, and 'app.[APP-NAME].default.enabled property', a default name is used.
