${symbol_pound}${symbol_pound} EVENT PROCESSING TWEAKING
${symbol_pound}${symbol_pound} (DB -> Elastic Search)
${symbol_pound}${symbol_pound}
${symbol_pound}
${symbol_pound}${symbol_pound} Set to false if no Activiti events need to be generated.
${symbol_pound}${symbol_pound} Do note that the reporting/analytics data is then lost forever.
${symbol_pound}event.generation.enabled=true
${symbol_pound}
${symbol_pound}${symbol_pound} Set to false to not to event processing. This could be useful
${symbol_pound}${symbol_pound} in a clustered setup where only sone nodes do the processing
${symbol_pound}event.processing.enabled=true
${symbol_pound}
${symbol_pound}${symbol_pound} The amount of events that are tried to be locked and processed in one go
${symbol_pound}event.processing.blocksize=100
${symbol_pound}
${symbol_pound}${symbol_pound} The cron expression that defines how often the events generated by the Activiti process engine are
${symbol_pound}${symbol_pound} processed (= read from the database and fed into Elastic Search). By default every 5 seconds.
${symbol_pound}event.processing.cronExpression=0/5 * * * * ?
${symbol_pound}
${symbol_pound}${symbol_pound} The cron expression that defines how often 'expired' events are processed. These are events
${symbol_pound}${symbol_pound} that were locked, but never processed (maybe the node processing them went down).
${symbol_pound}${symbol_pound} By default every 30 minutes.
${symbol_pound}event.processing.expired.cronExpression=0 0/30 * * * ?
${symbol_pound}
${symbol_pound}${symbol_pound} The maximum time an event is considered 'locked'. After that it can be taken by another processing thread
${symbol_pound}${symbol_pound}event.processing.max.locktime=600000
${symbol_pound}
${symbol_pound}${symbol_pound} Possible options:
${symbol_pound}${symbol_pound} - 'move': the processed events are moved to another db table to keep the event log table small and snappy
${symbol_pound}${symbol_pound} - 'delete': the processed events are deleted
${symbol_pound}${symbol_pound}
${symbol_pound}${symbol_pound} Comment this line out to do nothing: events are kept in the original table as-is
${symbol_pound}event.processing.processed.events.action=move
${symbol_pound}
${symbol_pound}${symbol_pound} The cron expression that defines how often the action defined above happens
${symbol_pound}${symbol_pound} By default every 20 minutes.
${symbol_pound}event.processing.processed.action.cronExpression=0 25/45 * * * ?
