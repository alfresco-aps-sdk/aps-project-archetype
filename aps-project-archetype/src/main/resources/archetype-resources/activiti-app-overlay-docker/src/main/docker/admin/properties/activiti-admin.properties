${symbol_pound} Passwords for rest endpoints and master configs are stored encrypted in the database using AES/CBC/PKCS5PADDING
${symbol_pound} It needs a 128-bit initialization vector (http://en.wikipedia.org/wiki/Initialization_vector)
${symbol_pound} and a 128-bit secret key represented as 16 ascii characters below
${symbol_pound}
${symbol_pound} Do note that if these properties are changed after passwords have been saved, all existing passwords
${symbol_pound} will not be able to be decrypted and the password would need to be reset in the UI.
security.encryption.credentialsIVSpec=j8kdO2hejA9lKmm6
security.encryption.credentialsSecretSpec=9FGl73ngxcOoJvmL

