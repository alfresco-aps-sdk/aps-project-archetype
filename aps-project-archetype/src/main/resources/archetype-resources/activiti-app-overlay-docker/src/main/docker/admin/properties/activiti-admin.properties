${symbol_pound}
${symbol_pound} Cluster settings
${symbol_pound}

${symbol_pound} This a period of time, expressed in milliseconds, that indicates
${symbol_pound} when a node is deemed to be inactive and is removed from the list
${symbol_pound} of nodes of a cluster (nor will it appear in the 'monitoring' section of the application).
${symbol_pound}
${symbol_pound} When a node is properly shut down, it will send out an event indicating
${symbol_pound} it is shut down. From that point on, the data will be kept in memory for the amount
${symbol_pound} of time indicated here.
${symbol_pound} When a node is not properly shut down (eg hardware failure), this is the period of time
${symbol_pound} before removal, since the time the last event is received.
${symbol_pound}
${symbol_pound} Make sure the value here is higher than the sending interval of the nodes, to avoid
${symbol_pound} that nodes incorrectly removed.
${symbol_pound}
${symbol_pound} By default 10 minutes
cluster.monitoring.max.inactive.time=600000

${symbol_pound} A cron expression that configures when the check for inactive nodes is made.
${symbol_pound} When executed, this will mark any node that hasn't been active for 'cluster.monitoring.max.inactive.time'
${symbol_pound} seconds, as an inactive node. Default: every 5 minutes.
cluster.monitoring.inactive.check.cronexpression=0 0/5 * * * ?

