${symbol_pound} JNDI CONFIG

${symbol_pound} If uncommented, the datasource will be looked up using the configured JNDI name.
${symbol_pound} This will have preference over any datasource configuration done below that doesn't use JNDI
${symbol_pound}
${symbol_pound} Eg for JBoss: java:jboss/datasources/activitiDS
${symbol_pound}
${symbol_pound}datasource.jndi.name=jdbc/activitiDS

${symbol_pound} Set whether the lookup occurs in a J2EE container, i.e. if the prefix "java:comp/env/" needs to be added if the JNDI
${symbol_pound} name doesn't already contain it. Default is "true".
${symbol_pound}datasource.jndi.resourceRef=true

