name: Publish Archetype to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to publish (e.g. 3.1.3)'
        required: true
        default: '3.1.3'
      next_version:
        description: 'Next development SNAPSHOT version (e.g. 3.1.4-SNAPSHOT)'
        required: true
        default: '3.1.4-SNAPSHOT'
      dry_run:
        description: 'Dry run (verify and package without publishing to Central)'
        required: false
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21 and GPG / Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Release Version (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_prep
        run: |
          RELEASE_VER="${{ inputs.release_version }}"
          NEXT_VER="${{ inputs.next_version }}"
          TAG_NAME="v${RELEASE_VER}"
          
          echo "Setting release version to ${RELEASE_VER}..."
          mvn --batch-mode versions:set -DnewVersion="${RELEASE_VER}" -DgenerateBackupPoms=false
          
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_ver=${RELEASE_VER}" >> $GITHUB_OUTPUT
          echo "next_ver=${NEXT_VER}" >> $GITHUB_OUTPUT

      - name: Dry Run (Verify & Package without publishing)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          echo "Executing Dry Run (compilation, source jar, javadoc jar, and gpg signing)..."
          mvn --batch-mode clean verify -Prelease -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Deploy to Maven Central
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          echo "Deploying archetype to Maven Central Portal..."
          mvn --batch-mode clean deploy -Prelease -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}"

      - name: Commit, Tag and Push Release Version (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          RELEASE_VER="${{ steps.dispatch_prep.outputs.release_ver }}"
          NEXT_VER="${{ steps.dispatch_prep.outputs.next_ver }}"
          TAG_NAME="${{ steps.dispatch_prep.outputs.tag_name }}"
          
          echo "Committing release version ${RELEASE_VER}..."
          git commit -am "Release version ${RELEASE_VER}"
          
          echo "Creating tag ${TAG_NAME}..."
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          
          echo "Setting next development version ${NEXT_VER}..."
          mvn --batch-mode versions:set -DnewVersion="${NEXT_VER}" -DgenerateBackupPoms=false
          git commit -am "[skip ci] Next development version ${NEXT_VER}"
          
          echo "Pushing commits and tag to origin..."
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${TAG_NAME}"

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.dispatch_prep.outputs.tag_name || github.ref_name }}
        run: |
          echo "Creating GitHub Release for ${TAG_NAME}..."
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes
