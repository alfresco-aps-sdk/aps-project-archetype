${symbol_pound} FOR AUTHENTICATION:

${symbol_pound} How to map the user id entered by the user to that passed through to LDAP
${symbol_pound} - simple 
${symbol_pound}    - this must be a DN and would be something like
${symbol_pound}      uid=%s,ou=People,dc=company,dc=com
${symbol_pound} - digest
${symbol_pound}    - usually pass through what is entered
${symbol_pound}      %s
${symbol_pound} If not set, an LDAP query involving ldap.synchronization.personQuery and ldap.synchronization.userIdAttributeName will 
${symbol_pound} be performed to resolve the DN dynamically. This allows directories to be structured and doesn't require the user ID to
${symbol_pound} appear in the DN.
${symbol_pound}ldap.authentication.userNameFormat=






