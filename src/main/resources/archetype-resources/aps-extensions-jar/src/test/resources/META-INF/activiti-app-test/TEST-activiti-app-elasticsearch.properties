${symbol_pound}
${symbol_pound} EVENT PROCESSING TWEAKING
${symbol_pound} (DB -> Elastic Search)
${symbol_pound}

${symbol_pound} Set to false if no Activiti events need to be generated.
${symbol_pound} Do note that the reporting/analytics data is then lost forever.
event.generation.enabled=true

${symbol_pound} Set to false to not to event processing. This could be useful 
${symbol_pound} in a clustered setup where only sone nodes do the processing
event.processing.enabled=true

${symbol_pound} The amount of events that are tried to be locked and processed in one go
event.processing.blocksize=100000

${symbol_pound} The cron expression that defines how often the events generated by the Activiti process engine are
${symbol_pound} processed (= read from the database and fed into Elastic Search). By default every 5 seconds(0/5 * * * * ?). (changed temporarily to every 10 hours inorder to stop running schedulers)
event.processing.cronExpression=0 0 0/10 * * ?

${symbol_pound} The cron expression that defines how often 'expired' events are processed. These are events
${symbol_pound} that were locked, but never processed (maybe the node processing them went down).
${symbol_pound} By default every 30 minutes(0 0/30 * * * ?). (changed temporarily to every 10 hours inorder to stop running schedulers)
event.processing.expired.cronExpression=0 0 0/10 * * ?

${symbol_pound} The maximum time an event is considered 'locked'. After that it can be taken by another processing thread
${symbol_pound}event.processing.max.locktime=600000

${symbol_pound} Possible options:
${symbol_pound} - 'move': the processed events are moved to another db table to keep the event log table small and snappy
${symbol_pound} - 'delete': the processed events are deleted
${symbol_pound} 
${symbol_pound} Comment this line out to do nothing: events are kept in the original table as-is
event.processing.processed.events.action=move

${symbol_pound} The cron expression that defines how often the action defined above happens
${symbol_pound} By default every 20 minutes(0 25/45 * * * ?). (changed temporarily to every 10 hours inorder to stop running schedulers)
event.processing.processed.action.cronExpression=0 0 0/10 * * ?



